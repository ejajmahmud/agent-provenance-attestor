[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-provenance-attestor"
version = "0.1.0"
description = "Cryptographic provenance attestor signing agent tool inputs, outputs, and model identities for untamperable audit trails"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-provenance-attestor = "agent_provenance_attestor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_provenance_attestor*"]
